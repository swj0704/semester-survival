<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한 학기 버티기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #e9e1d3;
  --paper: #fffdf6;
  --paper-2: #fbf6e8;
  --grid: rgba(120, 150, 190, 0.16);
  --ink: #2b2a33;
  --ink-soft: #6b6878;
  --ink-faint: #a6a2b0;
  --pen: #2f5fb3;
  --red: #d8434b;
  --hl: rgba(255, 92, 92, 0.22);
  --hl-yellow: rgba(255, 221, 87, 0.55);
  --postit: #ffe98a;
  --postit-ink: #4a3f12;
  --tape: rgba(170, 210, 230, 0.7);
  --ring: #b9b2a3;
  --sleep: #5b6fb8;
  --class: #b8b3a8;
  --study: #3e9e74;
  --work: #e8873a;
  --night: #8a5bb8;
  --rest: #f2c94c;
  --good: #3e9e74;
  --shadow: 0 1px 2px rgba(60, 50, 30, .08), 0 8px 24px rgba(60, 50, 30, .10);
  --on-pen: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #12141f;
    --paper: #1c2033;
    --paper-2: #222740;
    --grid: rgba(160, 180, 230, 0.08);
    --ink: #e8e6f0;
    --ink-soft: #a9a7bd;
    --ink-faint: #6c6a82;
    --pen: #8fb1ff;
    --red: #ff7a80;
    --hl: rgba(255, 110, 110, 0.22);
    --hl-yellow: rgba(255, 221, 87, 0.22);
    --postit: #4a4220;
    --postit-ink: #f6e9b0;
    --tape: rgba(120, 160, 190, 0.45);
    --ring: #4b5068;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --on-pen: #0f1220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #12141f; --paper: #1c2033; --paper-2: #222740; --grid: rgba(160,180,230,.08);
  --ink: #e8e6f0; --ink-soft: #a9a7bd; --ink-faint: #6c6a82; --pen: #8fb1ff; --red: #ff7a80;
  --hl: rgba(255,110,110,.22); --hl-yellow: rgba(255,221,87,.22); --postit: #4a4220; --postit-ink: #f6e9b0;
  --tape: rgba(120,160,190,.45); --ring: #4b5068; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --on-pen: #0f1220; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--desk);
  color: var(--ink);
  font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
.hand { font-family: 'Gaegu', 'Gowun Dodum', cursive; }
button { font-family: inherit; color: inherit; }
.wrap { max-width: 1060px; margin: 0 auto; padding-block: 24px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { display: none; }
.screen.on { display: block; animation: fade .35s ease; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* paper */
.paper {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  position: relative;
}

/* buttons */
.btn {
  border: 2px solid var(--ink);
  background: var(--paper);
  border-radius: 10px;
  padding: 10px 18px;
  font-size: 16px;
  cursor: pointer;
  transition: transform .12s ease, box-shadow .12s ease;
  box-shadow: 3px 3px 0 var(--ink);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.primary { background: var(--pen); color: var(--on-pen); border-color: var(--ink); }
.btn.small { padding: 6px 12px; font-size: 14px; box-shadow: 2px 2px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 2px 2px 0 var(--ink); }
.btn.ghost { box-shadow: none; border-style: dashed; }

/* cover */
.cover {
  max-width: 520px; margin: 6vh auto 0; padding: 56px 40px 44px; text-align: center;
  background: #31507a; color: #fdf8ea; border-radius: 14px 22px 22px 14px;
  box-shadow: inset 14px 0 0 rgba(0,0,0,.18), var(--shadow); position: relative;
}
.cover::after {
  content: ''; position: absolute; inset: 14px 14px 14px 28px; border: 2px dashed rgba(255,255,255,.25); border-radius: 10px; pointer-events: none;
}
.cover .sticker {
  display: inline-block; background: #ffe98a; color: #4a3f12; padding: 4px 14px; border-radius: 6px;
  transform: rotate(-3deg); font-size: 20px; margin-bottom: 18px;
}
.cover h1 { font-family: 'Gaegu', cursive; font-size: 56px; margin: 4px 0 6px; letter-spacing: 1px; line-height: 1.1; }
.cover p { margin: 0 0 28px; opacity: .85; }
.cover .btns { display: flex; flex-direction: column; gap: 12px; align-items: center; position: relative; z-index: 1; }
.cover .btn { min-width: 200px; background: #fdf8ea; color: #22314a; border-color: #11192a; box-shadow: 3px 3px 0 #11192a; }
.cover .note { margin-top: 22px; font-size: 13px; opacity: .7; }
.cover .diff { position: relative; z-index: 1; margin: 0 0 18px; }
.cover .diff-label { font-size: 13px; opacity: .75; margin-bottom: 8px; }
.cover .diff-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.cover .diff-row button {
  font: inherit; font-size: 15px; padding: 6px 16px; border-radius: 999px; cursor: pointer;
  background: transparent; color: #fdf8ea; border: 2px solid rgba(253,248,234,.55);
}
.cover .diff-row button[aria-checked="true"] { background: #ffe98a; color: #4a3f12; border-color: #ffe98a; font-weight: 700; }
.cover .diff-desc { font-size: 13px; opacity: .8; margin-top: 8px; min-height: 2.6em; }
.houses { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 6px 0 18px; }
.house {
  font: inherit; text-align: left; cursor: pointer; padding: 12px; border-radius: 8px; color: var(--ink);
  background: var(--paper); border: 2px dashed var(--ink-faint); display: flex; flex-direction: column; gap: 4px; min-width: 0;
}
.house[aria-checked="true"] { border: 2px solid var(--pen); background: var(--paper-2); box-shadow: 3px 3px 0 var(--pen); }
.house .hn { font-family: 'Gaegu', cursive; font-size: 22px; font-weight: 700; line-height: 1; }
.house .hr { font-weight: 700; font-variant-numeric: tabular-nums; }
.house .hd { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.house .hs { font-size: 12px; line-height: 1.5; }
.house .hs .up { color: var(--good); } .house .hs .dn { color: var(--red); }
.house-title { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.house-title b { color: var(--ink); }
@media (max-width: 560px) { .houses { grid-template-columns: 1fr; } }

/* prologue */
.prologue { max-width: 640px; margin: 4vh auto 0; padding: 36px 36px 30px; }
.prologue h2 { font-family: 'Gaegu', cursive; font-size: 34px; margin: 0 0 10px; }
.diaryline { font-family: 'Gaegu', cursive; font-size: 22px; line-height: 1.6; margin: 0; color: var(--ink); }
.bill {
  margin: 22px 0; padding: 16px 18px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper-2);
  display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
}
.bill .amt { font-size: 26px; font-weight: 700; }
.rules { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 14px; }
.rules li { margin: 4px 0; }
.rules b { color: var(--ink); font-weight: 600; }

/* planner */
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
.tabs { display: flex; gap: 3px; flex-wrap: wrap; }
.tabs span {
  width: 26px; height: 22px; border-radius: 5px 5px 0 0; font-size: 11px; display: grid; place-items: center;
  background: var(--paper-2); color: var(--ink-faint); border: 1px solid var(--grid);
}
.tabs span.vac { background: var(--hl-yellow); color: var(--ink-soft); }
.tabs span.done { opacity: .45; }
.tabs span.now { background: var(--pen); color: var(--on-pen); font-weight: 700; transform: translateY(-3px); }
.tabs span.exam { outline: 2px solid var(--red); outline-offset: -2px; }
.iconbtn { white-space: nowrap; flex: none; background: none; border: none; cursor: pointer; font-size: 13px; color: var(--ink-soft); text-decoration: underline; padding: 4px; }

.book { display: grid; grid-template-columns: 1fr 1fr; position: relative; }
.book .page { padding: 26px 30px 28px; min-height: 560px; }
.book .page.left { border-radius: 10px 2px 2px 10px; }
.book .page.right { border-radius: 2px 10px 10px 2px; }
.spine {
  position: absolute; left: 50%; top: 18px; bottom: 18px; width: 22px; transform: translateX(-50%); z-index: 2;
  background: radial-gradient(circle at 50% 50%, transparent 5px, var(--ring) 5.5px, var(--ring) 7.5px, transparent 8px) 0 0 / 22px 34px repeat-y;
  pointer-events: none;
}
.pagehead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 16px; }
.pagehead h2 { font-family: 'Gaegu', cursive; font-size: 32px; margin: 0; line-height: 1; }
.pagehead .sub { color: var(--ink-soft); font-size: 14px; }

.stat { display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--grid); }
.stat .k { color: var(--ink-soft); font-size: 14px; }
.stat .v { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.stat .v.neg { color: var(--red); }
.bar { height: 10px; background: var(--grid); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 6px; transition: width .4s ease; }
.lvtag { font-size: 12px; color: var(--ink-soft); font-weight: 400; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
.chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--paper-2); border: 1px solid var(--grid); color: var(--ink-soft); }
.chip.warn { background: var(--hl); color: var(--red); border-color: transparent; font-weight: 600; }
.chip.info { background: var(--hl-yellow); color: var(--ink); border-color: transparent; }

.postit {
  background: var(--postit); color: var(--postit-ink); padding: 14px 16px 16px; border-radius: 2px;
  box-shadow: 0 6px 14px rgba(0,0,0,.12); transform: rotate(-1.2deg); position: relative; margin-top: 18px;
}
.postit::before {
  content: ''; position: absolute; top: -9px; left: 50%; width: 70px; height: 18px; transform: translateX(-50%) rotate(2deg);
  background: var(--tape);
}
.postit .lbl { font-size: 12px; opacity: .7; }
.postit .txt { font-family: 'Gaegu', cursive; font-size: 21px; line-height: 1.35; }

.tuition {
  margin-top: 18px; border: 2px solid var(--red); border-radius: 10px; padding: 14px 16px; background: var(--paper);
}
.tuition h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; }
.tuition h3 .dd { color: var(--red); font-family: 'Gaegu', cursive; font-size: 22px; }
.tuition .row { display: flex; justify-content: space-between; font-size: 14px; margin: 4px 0; }
.tuition input[type=range] { width: 100%; }
.tuition .paid { color: var(--good); font-weight: 700; }

/* sliders */
.slider { display: grid; grid-template-columns: 76px 1fr 78px; align-items: center; gap: 10px; padding: 7px 0; }
.slider label { font-size: 14px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.slider output { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.slider small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-faint); }
input[type=range] { -webkit-appearance: none; appearance: none; height: 6px; background: var(--grid); border-radius: 4px; outline: none; width: 100%; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); cursor: pointer; }
input[type=range]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px var(--hl-yellow); }

.fixedrow { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-soft); padding: 6px 0; border-top: 1px dashed var(--grid); }
.fixedrow b { color: var(--ink); }

.timebar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin: 14px 0 6px; border: 1.5px solid var(--ink); }
.timebar i { display: block; height: 100%; transition: width .25s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--ink-soft); }
.legend span { display: inline-flex; align-items: center; gap: 4px; }

.forecast { margin-top: 14px; padding: 12px 14px; background: var(--paper-2); border-radius: 8px; border: 1px solid var(--grid); font-size: 14px; }
.forecast .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 16px; }
.forecast .grid2 div { display: flex; justify-content: space-between; }
.forecast .grid2 b { font-variant-numeric: tabular-nums; }
.forecast .alert { margin-top: 8px; font-weight: 700; color: var(--red); background: var(--hl); padding: 4px 8px; border-radius: 4px; display: inline-block; }
.go { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.hpbar { position: relative; }
.hpbar b { position: absolute; top: 0; right: 0; bottom: 0; background: repeating-linear-gradient(45deg, var(--ink-faint) 0 3px, transparent 3px 6px); }
.wkrow { display: grid; grid-template-columns: 40px 1fr auto; gap: 8px; font-size: 13px; padding: 4px 0; border-bottom: 1px dotted var(--grid); }
.wkrow .ev { color: var(--ink-soft); font-size: 12px; }
.semhist { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.semhist span { font-size: 12px; padding: 3px 8px; border-radius: 6px; background: var(--paper-2); border: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.verdict { margin: 10px 0; padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--ink); background: var(--paper); }
.verdict.bad { border-color: var(--red); background: var(--hl); }
.verdict.good { border-color: var(--good); }
.verdict b { display: block; }
.go .btn { font-size: 18px; padding: 12px 22px; }

/* modal */
.overlay { position: fixed; inset: 0; background: rgba(20, 18, 30, .45); display: none; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) calc(16px + env(safe-area-inset-left, 0px)); z-index: 50; }
.overlay.on { display: flex; animation: fade .25s ease; }
.card {
  background: var(--postit); color: var(--postit-ink); width: min(440px, 100%); padding: 28px 24px 22px; position: relative;
  transform: rotate(-1deg); box-shadow: 0 18px 40px rgba(0,0,0,.28); border-radius: 2px;
}
.card::before { content: ''; position: absolute; top: -11px; left: 50%; width: 96px; height: 22px; transform: translateX(-50%) rotate(-2deg); background: var(--tape); }
.card .when { font-size: 12px; opacity: .7; }
.card h3 { font-family: 'Gaegu', cursive; font-size: 32px; margin: 2px 0 6px; line-height: 1.1; }
.card p { margin: 0 0 16px; }
.choice {
  display: block; width: 100%; text-align: left; margin: 8px 0 0; padding: 10px 14px; border: 2px solid var(--postit-ink);
  background: rgba(255,255,255,.35); border-radius: 8px; cursor: pointer; color: var(--postit-ink);
}
.choice:hover { background: rgba(255,255,255,.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .choice { background: rgba(255,255,255,.06); } :root:not([data-theme="light"]) .choice:hover { background: rgba(255,255,255,.12); } }
:root[data-theme="dark"] .choice { background: rgba(255,255,255,.06); }
.choice b { display: block; font-size: 16px; }
.choice span { font-size: 13px; opacity: .8; }

/* receipt */
.receipt {
  width: min(420px, 100%); margin: 2vh auto 0; background: var(--paper); padding: 26px 26px 34px; box-shadow: var(--shadow);
  font-variant-numeric: tabular-nums; position: relative;
  -webkit-mask: linear-gradient(#000 0 0) top / 100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 20px 10px repeat-x;
          mask: linear-gradient(#000 0 0) top / 100% calc(100% - 10px) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 20px 10px repeat-x;
}
.receipt h2 { text-align: center; font-family: 'Gaegu', cursive; font-size: 30px; margin: 0; }
.receipt .meta { text-align: center; color: var(--ink-soft); font-size: 13px; margin-bottom: 12px; }
.receipt hr { border: none; border-top: 2px dashed var(--ink-faint); margin: 12px 0; }
.rline { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; padding: 2px 0; }
.rline .l { color: var(--ink-soft); }
.rline.total { font-size: 17px; font-weight: 700; }
.rline.total .l { color: var(--ink); }
.pos { color: var(--good); }
.neg { color: var(--red); }
.rnote { font-size: 13px; padding: 6px 10px; border-radius: 6px; margin: 6px 0 0; background: var(--hl); color: var(--red); font-weight: 600; }
.rnote.ok { background: var(--hl-yellow); color: var(--ink); font-weight: 400; }
.receipt .diary { font-family: 'Gaegu', cursive; font-size: 22px; text-align: center; margin: 14px 0 4px; line-height: 1.35; }
.receipt .btnrow { display: flex; justify-content: center; margin-top: 18px; }

/* grades & ending */
.report { max-width: 620px; margin: 3vh auto 0; padding: 32px 32px 30px; }
.report h2 { font-family: 'Gaegu', cursive; font-size: 36px; margin: 0 0 4px; }
.gtable { width: 100%; border-collapse: collapse; margin: 16px 0; }
.gtable td { padding: 10px 6px; border-bottom: 1px dashed var(--ink-faint); }
.gtable td:last-child { text-align: right; width: 70px; }
.gstamp { font-family: 'Gaegu', cursive; font-size: 28px; font-weight: 700; color: var(--red); display: inline-block; opacity: 0; transform: scale(1.6) rotate(-8deg); transition: all .25s cubic-bezier(.2,1.6,.4,1); }
.gstamp.on { opacity: 1; transform: scale(1) rotate(-8deg); }
.gpa { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; font-weight: 700; }
.bigstamp {
  width: 128px; height: 128px; border-radius: 50%; border: 5px double var(--red); color: var(--red); display: grid; place-items: center;
  font-family: 'Gaegu', cursive; font-size: 64px; font-weight: 700; transform: rotate(-12deg); margin: 6px auto 4px; line-height: 1;
}
.ending-title { text-align: center; font-family: 'Gaegu', cursive; font-size: 34px; margin: 4px 0 0; }
.ending-text { font-family: 'Gaegu', cursive; font-size: 21px; line-height: 1.5; text-align: center; margin: 10px 0 18px; }
.scorebox { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.scorebox div { border: 1.5px solid var(--ink); border-radius: 8px; padding: 10px; text-align: center; background: var(--paper); }
.scorebox b { display: block; font-size: 22px; }
.scorebox span { font-size: 12px; color: var(--ink-soft); }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; font-size: 14px; }
.stats div { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--grid); padding: 3px 0; }
.stats b { font-variant-numeric: tabular-nums; }
.center { text-align: center; }
.mt { margin-top: 20px; }

@media (max-width: 760px) {
  .wrap { padding-block: 16px 40px; }
  .book { grid-template-columns: 1fr; gap: 14px; }
  .book .page { min-height: 0; padding: 22px 18px; border-radius: 10px !important; }
  .spine { display: none; }
  .cover { padding: 44px 24px 36px; }
  .cover h1 { font-size: 46px; }
  .prologue, .report { padding: 26px 20px; }
  .forecast .grid2 { grid-template-columns: 1fr; }
  .scorebox { grid-template-columns: 1fr; }
  .stats { grid-template-columns: 1fr; }
  .tabs span { width: 21px; height: 20px; font-size: 9.5px; }
}
</style>
</head>
<body>
<div class="wrap">

  <!-- COVER -->
  <section class="screen on" id="sc-cover">
    <div class="cover">
      <div class="sticker hand">2027학번 새내기</div>
      <h1>한 학기 버티기</h1>
      <p>매주 168시간을 쪼개서 4년 8학기를 버텨라</p>
      <div class="diff">
        <div class="diff-label">난이도</div>
        <div class="diff-row" id="diff-row" role="radiogroup" aria-label="난이도"></div>

};

/* ========================================================= utils */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const won = n => (n < 0 ? '−' : '') + Math.abs(Math.round(n)).toLocaleString('ko-KR') + '원';
const man = n => { const v = Math.round(n / 1000) / 10; return (v < 0 ? '−' : '') + Math.abs(v).toLocaleString('ko-KR') + '만'; };
const signed = (n, f = x => x) => (n > 0 ? '+' : n < 0 ? '−' : '±') + f(Math.abs(n));
const round10 = n => Math.round(n / 100000) * 100000;
const isSem = w => w >= C.semesterStart;
const pay = (day, night) => {
  const h = day + night;
  const base = day * C.wage + night * C.wage * C.nightMul;
  const juhyu = h >= C.juhyuMinHours ? Math.min(h / 40, 1) * 8 * C.wage : 0;
  return { base: Math.round(base), juhyu: Math.round(juhyu), total: Math.round(base + juhyu) };
};
const effTier = hp => C.effTiers.find(t => hp >= t[0])[1];
const band = sk => C.bands.findIndex(b => sk >= b[0]);
const lvOf = sk => 5 - band(sk);
const semName = k => `${Math.floor(k / 2) + 1}학년 ${k % 2 + 1}학기`;
const vacName = k => (k % 2 === 0 ? '겨울방학' : '여름방학');
const weekLabel = (k, w) => isSem(w) ? `${semName(k)} ${w - C.semesterStart + 1}주차` : `${vacName(k)} ${w}주차`;
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;

/* ========================================================= difficulty & housing */
const DIFFS = {
  easy:   { name: '쉬움',   desc: '체력 소모가 적고 생활비가 싸요. 성적도 잘 나오고, 학사경고는 3번까지 버텨요.',
            drain: 0.93, living: 170000, rentMul: 0.9, startCash: 700000, bandMul: 0.9, warnLimit: 3, loanMinGpa: 2.0, eventChance: 0.45, tempt: 0.6, bad: 0.7 },
  normal: { name: '보통',   desc: '기본 난이도. 꾸준히 공부하고 체력을 지키면 4.0도 나와요.',

            drain: 1.07, living: 190000, rentMul: 1.1, startCash: 500000, bandMul: 1.08, warnLimit: 2, loanMinGpa: 2.5, eventChance: 0.55, tempt: 1, bad: 1.3 }
};
const HOUSES = {
  goshi:   { name: '고시원', rent: 350000, sleep: 0.93, rest: 0.85, study: 0.95,  desc: '벽이 얇고 방이 좁다. 싸지만 잠이 얕고 집에선 집중이 안 된다.' },
  oneroom: { name: '원룸',   rent: 600000, sleep: 1,    rest: 1,   study: 1,    desc: '평범한 자취방. 침대 옆이 곧 책상이다.' },
  tworoom: { name: '투룸',   rent: 850000, sleep: 1.07, rest: 1.2, study: 1.05, desc: '방 하나는 침실, 하나는 공부방. 푹 자고 푹 쉰다.' }
};
const HOUSE_KEYS = ['goshi', 'oneroom', 'tworoom'];
const TEMPT_IDS = ['game', 'youtube', 'netflix', 'drink', 'delivery', 'oversleep'];
const BAD_IDS = ['rentup', 'price', 'shiftcut', 'closed', 'food', 'family', 'phone', 'cold', 'laptop', 'wallet', 'freerider'];
const BASE_C = structuredClone(C);
function applyDiff(key) {
  const d = DIFFS[key] || DIFFS.normal;
  const b = structuredClone(BASE_C);
  Object.keys(b).forEach(k => { C[k] = b[k]; });
  ['cls', 'study', 'day', 'night'].forEach(k => { C.hp[k] = Math.round(C.hp[k] * d.drain * 1000) / 1000; });
  C.living = d.living; C.rentMul = d.rentMul; C.startCash = d.startCash;
  C.bands = C.bands.map(x => [isFinite(x[0]) ? Math.round(x[0] * d.bandMul) : x[0], x[1], x[2]]);
  C.warnLimit = d.warnLimit; C.loanMinGpa = d.loanMinGpa; C.eventChance = d.eventChance;
  C.temptWeight = d.tempt; C.badWeight = d.bad;
  C.diff = DIFFS[key] ? key : 'normal';
}
C.moveFee = 300000;
BASE_C.moveFee = 300000;
const diffName = () => DIFFS[C.diff || 'normal'].name;
const houseOf = s => HOUSES[s.house] || HOUSES.oneroom;
const houseRent = (key) => Math.round(HOUSES[key].rent * (C.rentMul || 1) / 10000) * 10000;

/* ========================================================= state */
let S = null;
function newState(diff = 'normal') {
  return {
    diff, house: 'oneroom',
    sem: 0, week: 1, cash: C.startCash, hp: C.startHp, fatigue: 0, skill: 0, debt: 0,
    tuition: 0, tuitionDue: 0, tuitionPaid: false, loanCap: 0, loanBlocked: false, scholarRate: 0, loanThis: 0,
    warnings: 0, overdue: 0, hospital: 0,
    plan: { sleep: 7, study: 0, day: 40, night: 0 },
    cur: { effMul: 1, workCut: 0 }, next: { effMul: 1, workCut: 0 },
    laptopWeeks: 0, labJob: false, grantApplied: false,
    rentExtra: 0, livingExtra: 0,
    used: [], usedForever: [], diary: '',
    totals: { sleep: 0, study: 0, work: 0, earned: 0, missedHw: 0, scholarships: 0, scholarWon: 0 },
    history: [], grades: null, gpa: null, screen: 'bill', over: null
  };
}
const livingCost = s => C.living + C.livingPerYear * Math.floor(s.sem / 2) + s.livingExtra;
const rentCost = s => houseRent(s.house in HOUSES ? s.house : 'oneroom') + s.rentExtra;
const maxHp = s => 100 - s.fatigue;

function startSemester(s, k) {
  s.sem = k; s.week = 1;
  const steps = (C.tuitionMax - C.tuitionMin) / C.tuitionStep;
  const base = C.tuitionMin + rint(0, steps) * C.tuitionStep;
  s.tuition = round10(base * Math.pow(1 + C.tuitionInflation, Math.floor(k / 2)));
  s.tuitionDue = round10(s.tuition * (1 - s.scholarRate));
  s.loanCap = s.loanBlocked ? 0 : Math.floor(s.tuitionDue * C.loanCapRate[k] / 100000) * 100000;
  s.tuitionPaid = s.tuitionDue === 0;
  s.loanThis = 0;
  s.skill = Math.round(s.skill * (k === 0 ? 0 : C.skillCarry));
  s.used = []; s.grantApplied = false; s.grades = null; s.gpa = null;
  s.screen = 'bill';
}
function save() { try { localStorage.setItem(C.saveKey, JSON.stringify(S)); } catch (e) {} }
function load() { try { const t = localStorage.getItem(C.saveKey); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function clearSave() { try { localStorage.removeItem(C.saveKey); } catch (e) {} }

}

function rollEvent(s) {
  const f = fixedEvent(s);
  if (f) return f;
  if (Math.random() >= C.eventChance) return null;
  const pool = EVENTS.filter(e => !s.used.includes(e.id) && !s.usedForever.includes(e.id) && e.when(s));
  if (!pool.length) return null;
  const w = e => TEMPT_IDS.includes(e.id) ? (C.temptWeight ?? 1) : BAD_IDS.includes(e.id) ? (C.badWeight ?? 1) : 1;
  let t = Math.random() * pool.reduce((a, e) => a + w(e), 0), e = pool[pool.length - 1];
  for (const x of pool) { t -= w(x); if (t <= 0) { e = x; break; } }
  s.used.push(e.id);
  if (e.once) s.usedForever.push(e.id);
  return e;
}
function blankMods() {
  return { cash: 0, hp: 0, skill: 0, extraDay: 0, extraNight: 0, extraStudy: 0, studyCut: 0, dayCut: 0, workMul: 1, classDelta: 0, effMul: 1, sleepDelta: 0, notes: [], event: null };
}

/* ========================================================= simulation */
function freeHours(s, sleep) { return 168 - sleep * 7 - (isSem(s.week) ? C.classHours : 0); }

function compute(s, plan, m, drainMul) {
  const sem = isSem(s.week);
  const cut = s.cur.workCut + m.dayCut;
  const day = Math.max(0, plan.day - cut) * m.workMul + m.extraDay + (s.labJob && sem ? 5 : 0);
  const night = plan.night * m.workMul + m.extraNight;
  const study = Math.max(0, plan.study - m.studyCut) + m.extraStudy;
  const cls = sem ? Math.max(0, C.classHours + m.classDelta) : 0;
  let sleep = Math.max(0, plan.sleep * 7 + m.sleepDelta);
  let rest = 168 - sleep - cls - day - night - study;
  if (rest < 0) { sleep = Math.max(0, sleep + rest); rest = 0; }
  const H = C.hp;
  const hs = houseOf(s);
  const recover = H.sleep * hs.sleep * Math.min(sleep, H.sleepCapDaily * 7) + H.rest * hs.rest * rest;
  const drain = (H.study * study + H.day * day + H.night * night + H.cls * cls) * drainMul;
  const hpEnd = Math.min(maxHp(s), s.hp + recover - drain + m.hp);
  let eff = effTier(s.hp) * s.cur.effMul * m.effMul * hs.study;
  if (sleep / 7 < C.lowSleepDaily) eff *= C.lowSleepMul;
  if (C.examWeeks.includes(s.week)) eff *= C.examMul;
  if (s.laptopWeeks > 0 && !m._laptopApplied) eff *= 0.8;
  const p = pay(day, night);
  const rent = C.rentWeeks.includes(s.week) ? rentCost(s) : 0;
  return { day, night, study, cls, sleep, rest, recover, drain, hpEnd, eff, gain: study * eff, pay: p, rent, living: livingCost(s) };
}

function forecast(s = S) {
  const m = blankMods();
  return { lo: compute(s, s.plan, m, 1 - C.hp.variance), hi: compute(s, s.plan, m, 1 + C.hp.variance) };
}

function settle(m) {
  const s = S;
  const sem = isSem(s.week);
  const r = compute(s, s.plan, m, 1 + rnd(-C.hp.variance, C.hp.variance));
  const out = { sem: s.sem, week: s.week, r, m, hpStart: s.hp, skillStart: s.skill, cashStart: s.cash, collapsed: false, hospitalFee: 0, notes: [...m.notes] };
  let income = r.pay.total;
  let gain = r.gain + (s.labJob && sem ? 2 : 0);
  let hp = r.hpEnd;
  if (hp <= 0) {
    out.collapsed = true;
    income = 0; gain = 0;
    out.hospitalFee = rint(C.hospitalFee[0] / 10000, C.hospitalFee[1] / 10000) * 10000;
    hp = Math.min(C.hospitalHp, maxHp(s));
    s.hospital++;
    if (sem) { gain -= C.absencePenalty; out.notes.push(`수업 결석 처리 · 능력치 −${C.absencePenalty}`); }
  }
  gain += m.skill;
  if (sem && !out.collapsed && r.study < C.assignmentMin) { gain -= C.assignmentPenalty; s.totals.missedHw++; out.hwMissed = true; }

  const expense = r.living + r.rent + out.hospitalFee;
  s.cash = s.cash + income - expense + m.cash;
  s.skill = Math.max(0, s.skill + gain);
  out.income = income; out.expense = expense; out.gain = gain;

  // 피로 누적
  const daily = r.sleep / 7, F = C.fatigue, fatBefore = s.fatigue;
  if (daily < F.under) s.fatigue = Math.min(F.max, s.fatigue + Math.round((F.under - daily) * F.perHour));
  else if (daily >= F.recoverAt) s.fatigue = Math.max(0, s.fatigue - F.recover);
  out.fatigueDelta = s.fatigue - fatBefore;

  if (s.cash < 0) { s.overdue++; hp -= C.overdueStress; out.overdue = s.overdue; } else s.overdue = 0;
  s.hp = Math.round(clamp(hp, 1, maxHp(s)) * 10) / 10;
  out.hpEnd = s.hp;

  s.totals.sleep += r.sleep;
  if (!out.collapsed) { s.totals.study += r.study; s.totals.work += r.day + r.night; s.totals.earned += income; }
  if (s.laptopWeeks > 0) s.laptopWeeks--;

  if (s.week === C.deadlineWeek && !s.tuitionPaid) s.over = 'expelled';
  else if (s.overdue >= C.overdueLimit) s.over = 'broke';

  out.diary = diaryFor(s, out);
  s.diary = out.diary;
  return out;
}

const IN = { sleep: $('in-sleep'), study: $('in-study'), day: $('in-day'), night: $('in-night') };

function fitPlan(changed) {
  const p = S.plan, free = freeHours(S, p.sleep), keys = ['study', 'day', 'night'];
  const total = keys.reduce((a, k) => a + p[k], 0);
  if (total > free) {
    if (changed && changed !== 'sleep') p[changed] = Math.max(0, free - (total - p[changed]));
    else for (const k of ['night', 'day', 'study']) {
      const over = keys.reduce((a, kk) => a + p[kk], 0) - free;
      if (over <= 0) break;
      p[k] = Math.max(0, p[k] - over);
    }
  }
  for (const k of keys) p[k] = Math.floor(p[k]);
}

function renderTabs() {
  const t = $('tabs'); t.innerHTML = '';
  for (let w = 1; w <= C.weeksPerSem; w++) {
    const sp = document.createElement('span');
    sp.textContent = w;
    if (!isSem(w)) sp.classList.add('vac');
    if (w < S.week) sp.classList.add('done');
    if (w === S.week) sp.classList.add('now');
    if (C.examWeeks.includes(w)) sp.classList.add('exam');
    sp.title = weekLabel(S.sem, w);
    t.appendChild(sp);
  }
}

function renderPlanner() {

  if (nextRent === s.week) chips.push(['warn', `이번 주 월세 −${man(rentCost(s))}`]);
  else if (nextRent) chips.push(['info', `다음 월세 W${nextRent}`]);
  if (s.overdue > 0) chips.push(['warn', `연체 ${s.overdue}주째 (${C.overdueLimit}주면 휴학)`]);
  if (s.warnings > 0) chips.push(['warn', `학사경고 ${s.warnings}회 (${C.warnLimit}회면 제적)`]);
  if (s.fatigue > 0) chips.push(['warn', `피로 누적 · 최대 체력 ${maxHp(s)}`]);
  if (C.examWeeks.includes(s.week)) chips.push(['info', '시험 주간 · 공부 효율 ×1.2']);
  const eff = effTier(s.hp);
  if (eff < 1) chips.push(['warn', `피곤함 · 공부 효율 ×${eff}`]);
  if (s.cur.effMul > 1) chips.push(['info', '컨디션 좋음 · 효율 ↑']);
  if (s.laptopWeeks > 0) chips.push(['warn', '노트북 없음 · 효율 ×0.8']);
  if (s.cur.workCut > 0) chips.push(['warn', `알바 −${s.cur.workCut}h`]);
  if (s.labJob && sem) chips.push(['info', '연구실 보조 5h/주']);
  if (sem) chips.push(['', `과제: 공부 ${C.assignmentMin}h 이상`]);
  $('pl-chips').innerHTML = chips.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join('');

  renderTuition();
  $('pl-diary').style.display = s.diary ? '' : 'none';
  $('pl-diary-txt').textContent = s.diary;
  IN.sleep.value = s.plan.sleep;
  renderPlan();
}

function renderTuition() {
  const s = S, box = $('pl-tuition');
  if (s.week > C.deadlineWeek) { box.innerHTML = ''; return; }
  const schol = s.scholarRate ? `<div class="row"><span>성적장학금 (${s.scholarRate === 1 ? '전액' : '반액'})</span><b class="pos">−${won(s.tuition - s.tuitionDue)}</b></div>` : '';
  if (s.tuitionPaid) {
    box.innerHTML = `<div class="tuition" style="border-color:var(--good)"><h3><span>학비 ${won(s.tuitionDue)}</span><span class="paid">납부 완료</span></h3>${schol}
      <div class="row"><span>이번 학기 대출</span><b>${won(s.loanThis)}</b></div><div class="row"><span>내 돈</span><b>${won(s.tuitionDue - s.loanThis)}</b></div></div>`;
    return;
  }
  const left = C.deadlineWeek - s.week;
  const cap = s.loanCap;
  const def = s._loanDraft != null ? clamp(s._loanDraft, 0, cap) : cap;
  const capNote = s.loanBlocked ? '<div class="rnote">직전 학기 평점 미달로 이번 학기는 대출 불가</div>'
    : `<div class="row" style="color:var(--ink-soft);font-size:12.5px"><span>대출 한도 (학비의 ${Math.round(C.loanCapRate[s.sem] * 100)}%)</span><span>${won(cap)}</span></div>`;
  box.innerHTML = `<div class="tuition">
    <h3><span>학비 ${won(s.tuitionDue)}</span><span class="dd">${left === 0 ? '이번 주 마감!' : left + 1 + '주 남음'}</span></h3>
    ${schol}${capNote}
    <div class="row"><span>학자금 대출</span><b id="tu-loan"></b></div>
    <input type="range" id="tu-range" min="0" max="${cap}" step="100000" value="${def}" aria-label="학자금 대출 금액" ${cap === 0 ? 'disabled' : ''}>
    <div class="row"><span>내 돈으로 낼 금액</span><b id="tu-own"></b></div>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn small" id="tu-pay">납부하기</button></div>
  </div>`;
  const rg = $('tu-range');
  const upd = () => {
    const loan = +rg.value, own = s.tuitionDue - loan;
    s._loanDraft = loan;
    $('tu-loan').textContent = won(loan);
    $('tu-own').textContent = won(own);
    const short = own > 0 && own > s.cash;
    $('tu-own').style.color = short ? 'var(--red)' : '';
    $('tu-pay').disabled = short;
  };
  rg.addEventListener('input', upd);
  $('tu-pay').addEventListener('click', () => {
    const loan = +rg.value, own = s.tuitionDue - loan;
    if (own > 0 && own > s.cash) return;
    s.loanThis = loan; s.debt += loan; s.cash -= own; s.tuitionPaid = true; delete s._loanDraft;
    save(); renderPlanner();
  });
  upd();
}

function renderPlan() {
  const s = S, p = s.plan, sem = isSem(s.week);
  const free = freeHours(s, p.sleep);
  for (const k of ['study', 'day', 'night']) { IN[k].max = free; IN[k].value = p[k]; }
  const capH = C.hp.sleepCapDaily;
  $('out-sleep').innerHTML = p.sleep > capH
    ? `${p.sleep.toFixed(1)}h<small style="color:var(--red)">회복은 ${capH}h까지만</small>`
    : `${p.sleep.toFixed(1)}h<small>하루 · 회복 ${capH}h까지</small>`;
  $('out-study').textContent = p.study + 'h';
  $('out-day').textContent = p.day + 'h';
  $('out-night').textContent = p.night + 'h';
  const cls = sem ? C.classHours : 0;
  $('out-class').textContent = sem ? `${cls}h` : '방학 0h';
  const rest = free - p.study - p.day - p.night;
  $('out-rest').textContent = rest + 'h';
  $('pl-free').textContent = `자유시간 ${free}h`;
  const parts = [[p.sleep * 7, 'sleep'], [cls, 'class'], [p.study, 'study'], [p.day, 'work'], [p.night, 'night'], [rest, 'rest']];
  $('timebar').innerHTML = parts.map(([h, c]) => `<i style="width:${h / 168 * 100}%;background:var(--${c})" title="${h}h"></i>`).join('');

  const { lo, hi } = forecast();
  const dHpLo = Math.round(hi.hpEnd - s.hp), dHpHi = Math.round(lo.hpEnd - s.hp);
  const inc = lo.pay.total, exp = lo.living + lo.rent, cashAfter = s.cash + inc - exp;
  const alerts = riskAlerts(s, lo, hi, cashAfter);
  const fatNote = p.sleep < C.fatigue.under ? `<div class="alert">수면 ${C.fatigue.under}시간 미만 · 피로 누적 +${Math.round((C.fatigue.under - p.sleep) * C.fatigue.perHour)}</div>` : '';
  const rng = dHpLo === dHpHi ? signed(dHpLo) : `${signed(dHpLo)} ~ ${signed(dHpHi)}`;
  $('forecast').innerHTML = `<div class="grid2">
      <div><span>체력</span><b>${rng}</b></div>
      <div><span>능력치</span><b>+${Math.round(lo.gain)}</b></div>
      <div><span>알바 수입</span><b class="pos">+${man(inc)}</b></div>
      <div><span>생활비${lo.rent ? '+월세' : ''}</span><b class="neg">−${man(exp)}</b></div>
      <div><span>정산 후 잔고</span><b class="${cashAfter < 0 ? 'neg' : ''}">${man(cashAfter)}</b></div>
      <div><span>공부 효율</span><b>×${lo.eff.toFixed(2)}</b></div>
    </div>${alerts.map(a => `<div class="alert">${a}</div>`).join(' ')}${fatNote}
    <div style="font-size:12px;color:var(--ink-faint);margin-top:6px">이벤트는 반영 안 된 예상치예요.</div>`;
}
function riskAlerts(s, lo, hi, cashAfter) {
  const a = [];
  if (lo.hpEnd <= 0) a.push('이대로면 쓰러져요! 그 주가 통째로 무효');
  else if (hi.hpEnd <= 0) a.push('쓰러질 수도 있어요!');
  if (cashAfter < 0) a.push(`잔고 마이너스 예상 (연체 ${s.overdue + 1}주째)`);
  if (isSem(s.week) && s.plan.study < C.assignmentMin) a.push(`과제 미제출 예정 (능력치 −${C.assignmentPenalty})`);
  if (s.week === C.deadlineWeek && !s.tuitionPaid) a.push('학비 미납! 이번 주 안에 납부해야 해요');
  return a;
}

IN.sleep.addEventListener('input', () => { S.plan.sleep = +IN.sleep.value; fitPlan('sleep'); renderPlan(); });
for (const k of ['study', 'day', 'night']) IN[k].addEventListener('input', () => { S.plan[k] = +IN[k].value; fitPlan(k); renderPlan(); });

/* ========================================================= turn flow */
let autoLeft = 0, autoLog = [];
function goWeek() {
  const ev = rollEvent(S);
  const m = blankMods();
  if (!ev) return finishWeek(m);
  m.event = ev.title;
  $('ev-when').textContent = `W${S.week} · ${weekLabel(S.sem, S.week)}`;
  $('ev-title').textContent = ev.title;
  $('ev-text').textContent = ev.text;
  const box = $('ev-choices'); box.innerHTML = '';
  ev.choices.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = `<b>${ch.label}</b><span>${ch.desc}</span>`;
    b.addEventListener('click', () => {
      ch.apply(S, m);
      m.choice = ch.label;
      $('overlay').classList.remove('on');
      finishWeek(m);
    });
    box.appendChild(b);
  });
  $('overlay').classList.add('on');
  setTimeout(() => box.querySelector('button')?.focus(), 50);
}

function finishWeek(m) {
  const o = settle(m);
  if (autoLeft > 0) {
    autoLog.push(o);
    autoLeft--;
    const last = S.week >= C.weeksPerSem;
    const stop = S.over || o.collapsed || o.overdue || o.hwMissed || last || autoLeft === 0;
    if (!stop) {
      advanceWeek();
      const { lo, hi } = forecast();
      const cashAfter = S.cash + lo.pay.total - lo.living - lo.rent;
      const risky = riskAlerts(S, lo, hi, cashAfter).length > 0 || (S.week <= C.deadlineWeek && !S.tuitionPaid);
      if (!risky) { save(); renderPlanner(); show('planner'); setTimeout(goWeek, 120); return; }
      // 다음 주가 위험하면 여기서 멈추고 요약을 보여 준 뒤 플래너로
      S.week--; // 영수증의 "다음" 버튼이 다시 넘김
      S.next = S.cur; S.cur = S._prevCur;
    }
    renderReceipt(o, autoLog);
    autoLeft = 0; autoLog = [];
  } else renderReceipt(o, null);
  S.screen = 'result';
  save();
  show('result');
}

function advanceWeek() {
  S.week++;
  S._prevCur = S.cur;
  S.cur = S.next; S.next = { effMul: 1, workCut: 0 };
  fitPlan('sleep');
}

function receiptBody(o) {
  const r = o.r;
  const L = (l, v, cls = '') => `<div class="rline ${cls}"><span class="l">${l}</span><span>${v}</span></div>`;
  let h = '';
  if (o.collapsed) h += L('알바 수입', '0원 (쓰러짐)');
  else {
    if (r.day) h += L(`주간 알바 ${Math.round(r.day)}h`, '+' + won(r.day * C.wage), 'pos');
    if (r.night) h += L(`야간 알바 ${Math.round(r.night)}h`, '+' + won(r.night * C.wage * C.nightMul), 'pos');
    if (r.pay.juhyu) h += L('주휴수당', '+' + won(r.pay.juhyu), 'pos');
    if (!r.day && !r.night) h += L('알바 수입', '0원');
  }
  h += L('생활비', '−' + won(r.living), 'neg');
  if (r.rent) h += L('월세·관리비', '−' + won(r.rent), 'neg');
  if (o.hospitalFee) h += L('병원비', '−' + won(o.hospitalFee), 'neg');
  if (o.m.cash) h += L(o.m.event || '이벤트', (o.m.cash > 0 ? '+' : '−') + won(Math.abs(o.m.cash)), o.m.cash > 0 ? 'pos' : 'neg');
  return h;
}
function receiptNotes(o) {
  let h = '';
  if (o.m.event) h += `<div class="rnote ok">${o.m.event}: ${o.m.choice}</div>`;
  if (o.collapsed) h += `<div class="rnote">체력이 바닥나 쓰러졌어요. 이번 주 공부·알바는 무효, 병원비 ${won(o.hospitalFee)}.</div>`;
  o.notes.forEach(n => h += `<div class="rnote ok">${n}</div>`);
  if (o.hwMissed) h += `<div class="rnote">과제 미제출 · 능력치 −${C.assignmentPenalty}</div>`;
  if (o.fatigueDelta > 0) h += `<div class="rnote">피로 누적 +${o.fatigueDelta} · 최대 체력 ${maxHp(S)}</div>`;
  if (o.overdue) h += `<div class="rnote">잔고 마이너스! 연체 ${o.overdue}주째 · 스트레스로 체력 −${C.overdueStress}</div>`;
  return h;
}

function renderReceipt(o, log) {
  const s = S;
  const L = (l, v, cls = '') => `<div class="rline ${cls}"><span class="l">${l}</span><span>${v}</span></div>`;
  let h;
  if (log && log.length > 1) {
    const first = log[0];
    h = `<h2>W${first.week}~W${o.week} 정산</h2><div class="meta">${semName(s.sem)} · ${log.length}주 연속 진행</div><hr>`;
    h += log.map(x => `<div class="wkrow"><b>W${x.week}</b><span>체력 ${Math.round(x.hpStart)}→${Math.round(x.hpEnd)} · 능력치 ${signed(Math.round(x.gain))}${x.m.event ? `<div class="ev">${x.m.event}: ${x.m.choice}</div>` : ''}</span><span class="${s.cash < 0 ? '' : ''}">${signed(Math.round((x.income - x.expense + x.m.cash) / 1000) / 10, v => v + '만')}</span></div>`).join('');
    h += '<hr>' + L('잔고', `${won(first.cashStart)} → ${won(s.cash)}`, 'total' + (s.cash < 0 ? ' neg' : ''));
    h += L('체력', `${Math.round(first.hpStart)} → ${Math.round(o.hpEnd)}`);
    h += L('능력치', `${Math.round(first.skillStart)} → ${Math.round(s.skill)}`);
    h += receiptNotes(o);
  } else {
    h = `<h2>W${o.week} 정산</h2><div class="meta">${weekLabel(o.sem, o.week)} · 수면 ${r1(o.r.sleep)}h · 공부 ${Math.round(o.r.study)}h · 알바 ${Math.round(o.r.day + o.r.night)}h</div><hr>`;
    h += receiptBody(o) + '<hr>';
    h += L('잔고', won(s.cash), 'total' + (s.cash < 0 ? ' neg' : ''));
    h += L('체력', `${Math.round(o.hpStart)} → ${Math.round(o.hpEnd)}`);
    h += L('능력치', `${Math.round(o.skillStart)} → ${Math.round(s.skill)} (${signed(Math.round(o.gain))})`);
    h += receiptNotes(o);
  }
  h += `<div class="diary">“${o.diary}”</div>`;
  const label = s.over ? '결과 보기' : s.week >= C.weeksPerSem ? '성적 확인하기 →' : '다음 주 →';
  h += `<div class="btnrow"><button class="btn primary" id="btn-next">${label}</button></div>`;
  $('receipt').innerHTML = h;
  $('btn-next').addEventListener('click', nextFromResult);
  setTimeout(() => $('btn-next').focus(), 50);
}
const r1 = n => Math.round(n * 10) / 10;

function nextFromResult() {
  if (S.over) { clearSave(); return renderEnding(); }
  if (S.week >= C.weeksPerSem) return renderGrades();
  advanceWeek();
  save();
  renderPlanner();
  show('planner');
}

/* ========================================================= semester start / bill */

  $('bill').innerHTML = `

    <div class="bill">
      <div><div style="font-size:13px;color:var(--ink-soft)">${semName(k)} 등록금 고지서</div><div class="amt">${won(s.tuitionDue)}</div>${schol}</div>
      <div style="text-align:right;font-size:14px">납부 마감 <b style="color:var(--red)">W3 종료</b><br><span style="color:var(--ink-soft)">${loanLine}</span></div>
    </div>
    <div class="house-title" id="house-title"></div>
    <div class="houses" id="houses" role="radiogroup" aria-label="집 고르기"></div>
    ${hist}${rules}
    <div class="go"><button class="btn primary" id="btn-start">${vacName(k)} 시작 →</button></div>`;
  let choice = s.house in HOUSES ? s.house : 'oneroom';
  const pct = v => v === 1 ? '<span>보통</span>' : v > 1 ? `<span class="up">+${Math.round((v - 1) * 100)}%</span>` : `<span class="dn">−${Math.round((1 - v) * 100)}%</span>`;
  const drawHouses = () => {
    $('houses').innerHTML = HOUSE_KEYS.map(key => {
      const h = HOUSES[key];
      return `<button class="house" role="radio" aria-checked="${key === choice}" data-h="${key}">
        <span class="hn">${h.name}</span><span class="hr">월세 ${man(houseRent(key))}</span>
        <span class="hd">${h.desc}</span>
        <span class="hs">수면 회복 ${pct(h.sleep)}<br>휴식 회복 ${pct(h.rest)}<br>공부 효율 ${pct(h.study)}</span></button>`;
    }).join('');
    const moving = !first && choice !== s.house;
    $('house-title').innerHTML = first ? '<b>어디서 살까?</b> 집에 따라 월세와 회복량, 공부 효율이 달라요.'
      : moving ? `<b>${HOUSES[s.house].name} → ${HOUSES[choice].name} 이사</b> · 이사비 ${man(C.moveFee)} 원이 바로 빠져요.`
      : `<b>지금 사는 곳: ${HOUSES[s.house].name}</b> · 방학마다 이사할 수 있어요 (이사비 ${man(C.moveFee)} 원).`;
    document.querySelectorAll('#houses .house').forEach(b => b.addEventListener('click', () => { choice = b.dataset.h; drawHouses(); }));
  };
  drawHouses();
  show('prologue');
  $('btn-start').addEventListener('click', () => {
    if (!first && choice !== s.house) { s.cash -= C.moveFee; s.moved = (s.moved || 0) + 1; }
    s.house = choice;
    renderPlanner(); save(); show('planner');
  });
}

/* ========================================================= grades, report & ending */
function rollGrades() {
  const b = C.bands[band(S.skill)];
  return C.subjects[S.sem].map(name => { const g = C.grades[rint(b[1], b[2])]; return { name, g: g[0], p: g[1] }; });
}
function renderGrades() {
  if (!S.grades) { S.grades = rollGrades(); S.gpa = avg(S.grades.map(g => g.p)); }
  S.screen = 'grades';
  save();
  const gs = S.grades;
  $('grades').innerHTML = `<h2>${semName(S.sem)} 성적표</h2><div style="color:var(--ink-soft);font-size:14px">최종 능력치 ${Math.round(S.skill)} · Lv.${lvOf(S.skill)} · 난이도 ${diffName()}</div>
    <table class="gtable">${gs.map((g, i) => `<tr><td>${g.name}</td><td>3학점</td><td><span class="gstamp">${g.g}</span></td></tr>`).join('')}</table>
    <div class="gpa"><span>평점 평균</span><span class="gstamp">${S.gpa.toFixed(2)} / 4.5</span></div>
    <div class="go"><button class="btn primary" id="btn-report" style="visibility:hidden">학기 결산 →</button></div>`;
  show('grades');
  const stamps = [...document.querySelectorAll('#grades .gstamp')];
  stamps.forEach((el, i) => setTimeout(() => el.classList.add('on'), 350 + i * 330));
  setTimeout(() => { const b = $('btn-report'); b.style.visibility = 'visible'; b.focus(); }, 350 + stamps.length * 330 + 150);
  $('btn-report').addEventListener('click', renderReport);
}

function closeSemester() {
  // 학기 종료 처리 (한 번만)
  const s = S;
  if (s._closed === s.sem) return s._closeResult;
  const res = { gpa: s.gpa, warned: false, schol: 0, blocked: false, interest: 0 };
  s.history.push({ name: semName(s.sem), gpa: s.gpa, skill: Math.round(s.skill) });
  if (s.gpa < C.warnGpa) { s.warnings++; res.warned = true; }
  const sc = C.scholarship.find(x => s.gpa >= x[0]);
  s.scholarRate = sc ? sc[1] : 0; res.schol = s.scholarRate;
  if (sc) s.totals.scholarships++;
  s.loanBlocked = s.gpa < C.loanMinGpa; res.blocked = s.loanBlocked;
  res.interest = Math.round(s.debt * C.loanInterest);
  s.debt += res.interest;
  if (s.warnings >= C.warnLimit) s.over = 'academic';
  s._closed = s.sem; s._closeResult = res;
  return res;
}

function renderReport() {
  const s = S, res = closeSemester();
  s.screen = 'report';
  save();
  const last = s.sem >= C.semesters - 1;
  const v = (cls, t, d) => `<div class="verdict ${cls}"><b>${t}</b>${d}</div>`;
  let h = `<h2>${semName(s.sem)} 결산</h2>
    <div class="semhist">${s.history.map(x => `<span>${x.name} ${x.gpa.toFixed(2)}</span>`).join('')}</div>
    <div class="stats mt">
      <div><span>이번 학기 평점</span><b>${s.gpa.toFixed(2)}</b></div>
      <div><span>누적 평점</span><b>${avg(s.history.map(x => x.gpa)).toFixed(2)}</b></div>
      <div><span>잔고</span><b>${won(s.cash)}</b></div>
      <div><span>대출 잔액</span><b>${won(s.debt)}</b></div>
      <div><span>체력 / 최대</span><b>${Math.round(s.hp)} / ${maxHp(s)}</b></div>
      <div><span>학사경고</span><b>${s.warnings}회</b></div>
    </div>`;
  if (res.warned) h += v('bad', `학사경고 ${s.warnings}회째`, `평점 ${C.warnGpa} 미만이에요. ${C.warnLimit}회가 되면 제적이에요.`);
  if (!last && res.schol) h += v('good', `성적장학금 ${res.schol === 1 ? '전액' : '반액'}!`, '다음 학기 학비에서 빠져요.');
  if (!last && res.blocked) h += v('bad', '다음 학기 학자금 대출 불가', `평점 ${C.loanMinGpa} 미만이라 다음 학기 학비는 전부 내 돈으로 내야 해요.`);
  if (res.interest) h += `<div style="font-size:13px;color:var(--ink-soft);margin-top:6px">대출 이자 ${won(res.interest)}가 붙었어요.</div>`;
  const btn = s.over ? '결과 보기' : last ? '졸업식으로 →' : `${semName(s.sem + 1)} 준비 →`;
  h += `<div class="go"><button class="btn primary" id="btn-semnext">${btn}</button></div>`;
  $('report').innerHTML = h;
  show('report');
  $('btn-semnext').addEventListener('click', () => {
    if (s.over || last) { clearSave(); return renderEnding(); }
    startSemester(s, s.sem + 1);
    save();
    renderBill();
  });
}

function scoreOf() {
  const gpa = avg(S.history.map(x => x.gpa));
  const net = S.cash - S.debt;
  const a = clamp((gpa - 1) / 3.5 * 60, 0, 60);
  const f = clamp((net - C.score.finLow) / (C.score.finHigh - C.score.finLow) * 25, 0, 25);
  const bonus = S.hospital === 0 ? 5 : S.hospital <= 2 ? 2 : 0;
  const hl = clamp(S.hp * 0.1 + bonus, 0, 15);
  const total = a + f + hl;
  return { gpa, a, f, hl, total, rank: C.rank.find(r => total >= r[0])[1], net };
}

const ENDINGS = {
  expelled: ['제적', '학비 납부 기한을 넘겼다. 학사 시스템에 \'제적\' 두 글자가 떴다.'],
  academic: ['학사제적', '학사경고가 쌓일 만큼 쌓였다. 학교에서 온 등기우편을 한참 동안 열지 못했다.'],
  broke: ['생활고로 휴학', '월세와 카드값이 겹겹이 밀렸다. 결국 휴학계를 냈다. 언젠가 꼭 다시 돌아오자.'],
  god: ['갓생 졸업', '성적도, 통장도, 건강도 챙겼다. 졸업식 날 학사모를 던지며 소리 질렀다.'],
  summa: ['수석 졸업', '졸업식에서 이름이 불렸다. 4년 동안의 도서관 창가 자리가 떠올랐다.'],
  scholar: ['장학금 사냥꾼', '학비의 상당 부분을 장학금으로 해결했다. 통장도 성적표도 뿌듯하다.'],
  burnout: ['번아웃 졸업', '병원 신세를 너무 많이 졌다. 졸업장보다 침대가 더 반갑다.'],
  worker: ['알바왕 졸업', '사장님이 졸업 선물로 케이크를 사 줬다. 이력서 경력란이 꽉 찼다.'],
  debt: ['빚과 함께 졸업', '졸업장과 함께 대출 상환 안내문이 도착했다. 그래도 버텼다. 버틴 게 어디야.'],
  normal: ['무사히 졸업', '특별한 건 없었지만 4년을 무너지지 않고 버텼다. 그게 제일 어렵다는 걸 이제 안다.']
};
function endingKey(sc) {
  if (S.over) return S.over;
  if (sc.rank === 'S') return 'god';
  if (sc.gpa >= 4.0) return 'summa';
  if (S.totals.scholarships >= 4) return 'scholar';
  if (S.hospital >= 4) return 'burnout';
  if (S.totals.work >= 2000 && sc.net >= 0) return 'worker';
  if (S.debt >= 20000000) return 'debt';
  return 'normal';
}

function renderEnding() {
  const over = !!S.over;
  const sc = over ? null : scoreOf();
  const key = endingKey(sc || {});
  const [title, text] = ENDINGS[key];
  const t = S.totals;
  let h = '';
  if (over) {
    h += `<div class="bigstamp">끝</div><div class="ending-title">GAME OVER · ${title}</div><div class="center" style="color:var(--ink-soft);font-size:14px">난이도 ${diffName()}</div><p class="ending-text">${text}</p>`;
    h += `<div class="center" style="color:var(--ink-soft);font-size:14px">${semName(S.sem)} W${S.week}에서 멈췄어요. (${S.sem}/${C.semesters}학기 완료)</div>`;
  } else {
    h += `<div class="bigstamp">${sc.rank}</div><div class="ending-title">${title}</div><div class="center" style="color:var(--ink-soft);font-size:14px">난이도 ${diffName()}</div><p class="ending-text">${text}</p>`;
    h += `<div class="scorebox">
      <div><b>${sc.a.toFixed(1)}<small style="font-size:12px;color:var(--ink-soft)">/60</small></b><span>학업 · 누적 평점 ${sc.gpa.toFixed(2)}</span></div>
      <div><b>${sc.f.toFixed(1)}<small style="font-size:12px;color:var(--ink-soft)">/25</small></b><span>재정 · 순자산 ${man(sc.net)}</span></div>
      <div><b>${sc.hl.toFixed(1)}<small style="font-size:12px;color:var(--ink-soft)">/15</small></b><span>건강 · 체력 ${Math.round(S.hp)}</span></div>
    </div><div class="center" style="font-size:18px"><b>종합 ${sc.total.toFixed(1)}점</b></div>`;
  }
  if (S.history.length) h += `<div class="semhist" style="justify-content:center">${S.history.map(x => `<span>${x.name} ${x.gpa.toFixed(2)}</span>`).join('')}</div>`;
  h += `<div class="stats mt">
    <div><span>총 수면</span><b>${Math.round(t.sleep).toLocaleString()}h</b></div>
    <div><span>총 공부</span><b>${Math.round(t.study).toLocaleString()}h</b></div>
    <div><span>총 알바</span><b>${Math.round(t.work).toLocaleString()}h</b></div>
    <div><span>번 돈</span><b>${won(t.earned)}</b></div>
    <div><span>남은 잔고</span><b>${won(S.cash)}</b></div>
    <div><span>학자금 대출</span><b>${won(S.debt)}</b></div>
    <div><span>성적장학금</span><b>${t.scholarships}회</b></div>
    <div><span>입원</span><b>${S.hospital}회</b></div>
    <div><span>학사경고</span><b>${S.warnings}회</b></div>
    <div><span>과제 미제출</span><b>${t.missedHw}회</b></div>
  </div>
  <div class="go" style="justify-content:center"><button class="btn primary" id="btn-again">다시 하기</button></div>`;
  $('ending').innerHTML = h;
  show('ending');
  $('btn-again').addEventListener('click', () => { $('btn-continue').style.display = 'none'; show('cover'); });
}

/* ========================================================= boot */
let pickedDiff = 'normal';
try { const d = localStorage.getItem('semester-survival-diff'); if (DIFFS[d]) pickedDiff = d; } catch (e) {}
function drawDiff() {
  $('diff-row').innerHTML = Object.keys(DIFFS).map(k => `<button role="radio" aria-checked="${k === pickedDiff}" data-d="${k}">${DIFFS[k].name}</button>`).join('');
  $('diff-desc').textContent = DIFFS[pickedDiff].desc;
  document.querySelectorAll('#diff-row button').forEach(b => b.addEventListener('click', () => {
    pickedDiff = b.dataset.d;
    try { localStorage.setItem('semester-survival-diff', pickedDiff); } catch (e) {}
    drawDiff();
  }));
}
drawDiff();
function startNew() {
  clearSave();
  applyDiff(pickedDiff);
  S = newState(pickedDiff);
  startSemester(S, 0);
  save();
  renderBill();
}
function resume() {
  S = load();
  if (!S) return startNew();
  applyDiff(S.diff || 'normal');
  if (!(S.house in HOUSES)) S.house = 'oneroom';
  if (S.over) { clearSave(); return renderEnding(); }
  const sc = S.screen;
  if (sc === 'bill') return renderBill();
  if (sc === 'grades') return renderGrades();
  if (sc === 'report') return renderReport();
  if (sc === 'result') { if (S.week >= C.weeksPerSem) return renderGrades(); advanceWeek(); }
  renderPlanner(); show('planner');
}
$('btn-new').addEventListener('click', startNew);
$('btn-continue').addEventListener('click', resume);
$('btn-go').addEventListener('click', () => { autoLeft = 0; goWeek(); });
$('btn-auto').addEventListener('click', () => { autoLeft = C.autoWeeks; autoLog = []; goWeek(); });
$('btn-quit').addEventListener('click', () => { save(); $('btn-continue').style.display = ''; show('cover'); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || $('overlay').classList.contains('on')) return;
  if ($('sc-planner').classList.contains('on') && document.activeElement?.tagName !== 'BUTTON') { e.preventDefault(); autoLeft = 0; goWeek(); }
});
if (load()) $('btn-continue').style.display = '';
</script>
</body>
</html>
